[preset.0]
name="Windows Campaign"
platform="Windows Desktop"
runnable=true
custom_features="campaign"
export_filter="all_resources"
include_filter="addons/godotsteam/license.md,content/platform/*.vdf"
exclude_filter="docs/*,tests/*,tools/*,artifacts/*,builds/*,.tools/*,scripts/editor/*,scenes/ship_editor.tscn,scenes/gallery.tscn,content/ships_next/*"
export_path="builds/campaign-windows/Lightship.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.tools/export_templates/templates/windows_debug_x86_64.exe"
custom_template/release="res://.tools/export_templates/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Lightship"
application/file_description="Lightship"
application/file_version="0.3.0"
application/product_version="0.3.0"
codesign/enable=false

